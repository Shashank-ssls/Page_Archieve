<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Backdrop and Observer Lazy Images</title>
<style>
  /* Reproduces two real-site failures:
     1. a full-screen position:fixed backdrop carrying the page colour with
        light text on top (itch.io style themes);
     2. images that only get their src when an IntersectionObserver sees them,
        and fade out again once they leave the viewport. */
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #f4f4f4; }
  .backdrop { position: fixed; inset: 0; z-index: -1; background: #2b1d3a; }
  .hero { height: 100vh; display: grid; place-items: center; background: #44305c; font-size: 28px; }
  .card { width: 560px; margin: 40px auto; padding: 16px; border: 2px solid #f4f4f4; }
  .card img { display: block; width: 100%; height: 260px; background: #1e1e1e; opacity: 0; transition: opacity .3s; }
  .card img.shown { opacity: 1; }
  .end { width: 560px; margin: 40px auto 80px; padding: 16px; background: #0b6; color: #fff; }
</style>
</head>
<body>
<div class="backdrop"></div>
<section class="hero">HERO 100vh - should keep viewport height</section>
<main id="list"></main>
<p class="end">REVEAL FIXTURE FINAL MARKER</p>
<script>
  const list = document.getElementById('list');
  const svg = (i) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260"><rect width="100%" height="100%" fill="hsl(${i * 37} 70% 55%)"/><text x="50%" y="50%" fill="#111" font-size="40" text-anchor="middle" dominant-baseline="middle">LOADED ${i}</text></svg>`);
  for (let i = 1; i <= 16; i++) {
    const c = document.createElement('article'); c.className = 'card';
    c.innerHTML = `<h2>Card ${i}</h2><img alt="lazy ${i}" data-src="${svg(i)}">`;
    list.append(c);
  }
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const img = e.target;
      if (e.isIntersecting) {
        if (!img.src) img.src = img.dataset.src;
        img.onload = () => img.classList.add('shown');
        if (img.complete && img.src) img.classList.add('shown');
      } else {
        img.classList.remove('shown');
      }
    }
  });
  document.querySelectorAll('img[data-src]').forEach(img => io.observe(img));
</script>
</body>
</html>
