<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Rebuilt Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; }
  .col { display: flex; flex-direction: column; height: 100vh; }
  .bar { height: 52px; flex: none; padding: 14px 20px; background: #eee; border-bottom: 1px solid #ccc; }
  .host { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px; background: #fff; }
  .msg { margin: 16px 0; padding: 14px; border: 1px solid #ccd; border-radius: 10px; background: #f8f9ff; height: 160px; }
  .last { height: 40px; background: #ff00ff; color: #ff00ff; margin: 16px 0; }
</style>
</head>
<body>
<!-- Like Claude after its 2026-10 redesign: when the window height changes,
     the app throws away its chat scroller and mounts a fresh one with the same
     classes and the same messages. -->
<div class="col">
  <div class="bar">Chat title bar</div>
  <div class="host" id="host"></div>
</div>
<script>
  const host = document.getElementById('host');
  function mount() {
    const old = host.firstElementChild;
    const top = old ? old.scrollTop : 0;
    const s = document.createElement('div');
    s.className = 'chat-scroll';
    for (let i = 1; i <= 30; i++) {
      const m = document.createElement('div'); m.className = 'msg'; m.textContent = `Message ${i}`;
      s.append(m);
    }
    const last = document.createElement('div'); last.className = 'last'; last.textContent = 'END'; s.append(last);
    host.replaceChildren(s);
    s.scrollTop = top;
  }
  mount();
  let lastH = innerHeight;
  // Headless viewport overrides do not always fire resize; poll as well.
  const check = () => { if (innerHeight !== lastH) { lastH = innerHeight; mount(); } };
  window.addEventListener('resize', check);
  setInterval(check, 100);
</script>
</body>
</html>
