<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Inner Scroll Boxes</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 16px/1.5 system-ui, sans-serif; }
  .app { display: flex; height: 100%; }
  .side { width: 200px; background: #eee; overflow-y: auto; }
  .side p { margin: 0; padding: 8px; height: 60px; }
  .thread { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 700px; margin: 0 auto 32px; }
  .code { max-height: 220px; overflow: auto; background: #f4f4f4; border-radius: 12px; padding: 12px; white-space: pre; font: 13px/1.5 monospace; }
  .draft { height: 160px; overflow-y: scroll; border: 1px solid #ccc; padding: 12px; }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main class="thread" id="thread"></main>
</div>
<script>
  const side = document.getElementById('side');
  for (let i = 0; i < 40; i++) side.insertAdjacentHTML('beforeend', '<p>Chat ' + i + '</p>');
  const thread = document.getElementById('thread');
  for (let m = 0; m < 6; m++) {
    let code = 'CODE-BOX-' + m + '-FIRST line\n';
    for (let i = 0; i < 30; i++) code += '  | step ' + i + ' ' + '-'.repeat(40 + (i % 5) * 20) + '+\n';
    code += 'CODE-BOX-' + m + '-LAST line';
    let draft = '';
    for (let i = 0; i < 20; i++) draft += '<p>Draft paragraph ' + i + ' of message ' + m + '.</p>';
    thread.insertAdjacentHTML('beforeend',
      '<div class="msg"><p>Message ' + m + ' introduces a diagram.</p><div class="code"></div>' +
      '<div class="draft">' + draft + '<p>DRAFT-BOX-' + m + '-LAST</p></div></div>');
    thread.lastElementChild.querySelector('.code').textContent = code;
  }
  thread.insertAdjacentHTML('beforeend', '<p>INNER BOX FINAL MARKER</p>');
</script>
</body>
</html>
