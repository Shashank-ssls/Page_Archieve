<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Absolute App Shell</title>
<style>
  /* Like DeepSeek (2026-10): body is 0px tall with overflow hidden, and the
     whole app is an absolutely positioned layer (top:0; bottom:0) whose
     containing block is the viewport. A static body cannot clip that layer,
     so Full render must not report the panel as clipped. */
  html { height: 100%; }
  body { margin: 0; height: 0; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; }
  .shell { position: absolute; top: 0; bottom: 0; left: 0; right: 0; overflow: hidden; background: #202020; }
  .frame { position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 56px; flex: none; background: #2b2b2b; }
  .chat { flex: 1; overflow-y: auto; background: #1b1b1b; }
  .turn { margin: 12px auto; max-width: 720px; padding: 12px; background: #333; color: #eee; min-height: 80px; }
</style>
</head>
<body>
<div><div class="shell"><div class="frame"><div class="bar"></div><main class="chat" id="chat"></main></div></div></div>
<script>
  const chat = document.getElementById('chat');
  for (let i = 1; i <= 40; i++) { const t = document.createElement('div'); t.className = 'turn'; t.textContent = 'Turn ' + i; chat.append(t); }
</script>
</body>
</html>
