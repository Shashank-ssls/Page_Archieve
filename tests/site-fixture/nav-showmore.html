<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Navigating Show More</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; }
  .app { display: flex; height: 100vh; }
  nav { width: 220px; flex: none; padding: 16px; background: #f1f1f1; border-right: 1px solid #ccc; }
  .chat { flex: 1; min-width: 0; overflow-y: auto; padding: 0 20px; background: #fff; }
  .msg { margin: 16px 0; padding: 14px; border: 1px solid #ccd; border-radius: 10px; background: #f8f9ff; height: 160px; }
  .last { height: 40px; background: #ff00ff; color: #ff00ff; margin: 16px 0; }
  .recents { padding: 40px; font-size: 22px; }
</style>
</head>
<body>
<!-- Like Claude after its 2026-10 redesign: the sidebar's "Show more" under
     recent chats is a plain button that switches the app to another page.
     ?inner=1 puts such a button inside the chat itself, to test the guard
     that stops a capture when the address changes. -->
<div class="app" id="app">
  <nav><p>Recents</p><button type="button" id="side-more">Show more</button></nav>
  <div class="chat" id="chat"></div>
</div>
<script>
  const chat = document.getElementById('chat');
  for (let i = 1; i <= 25; i++) {
    const m = document.createElement('div'); m.className = 'msg'; m.textContent = `Message ${i}`;
    chat.append(m);
  }
  const last = document.createElement('div'); last.className = 'last'; last.textContent = 'END'; chat.append(last);
  function goRecents() {
    history.pushState({}, '', '/fx/recents');
    document.getElementById('app').innerHTML = '<div class="recents">Recents page</div>';
  }
  document.getElementById('side-more').addEventListener('click', goRecents);
  if (/inner=1/.test(location.search)) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Show more';
    b.addEventListener('click', goRecents);
    chat.prepend(b);
  }
</script>
</body>
</html>
