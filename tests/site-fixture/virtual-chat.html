<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Archive Test Fixture - Virtualized Chat App</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; }
  .app { display: flex; height: 100vh; }
  nav { width: 220px; background: #1d1d1b; color: #ddd; padding: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 52px; flex: none; border-bottom: 1px solid #ccc; padding: 14px 20px; background: #fafafa; }
  /* The scroll panel fills the remaining column height, like ChatGPT/Claude. */
  .thread { flex: 1; overflow-y: auto; position: relative; background: #fff; }
  .thread-head { position: sticky; top: 0; z-index: 2; background: #fff3c4; padding: 8px 20px; border-bottom: 1px solid #e0c96a; }
  .spacer { position: relative; }
  .row { position: absolute; left: 20px; right: 20px; height: 150px; padding: 14px; border: 1px solid #ccd; border-radius: 10px; background: #f8f9ff; }
  .composer { flex: none; margin: 10px 20px 16px; padding: 14px; border: 1px solid #888; border-radius: 14px; background: #eee; }
</style>
</head>
<body>
<div class="app">
  <nav>Sidebar<br>History</nav>
  <div class="col">
    <div class="topbar">Chat title bar</div>
    <div class="thread" id="thread">
      <div class="thread-head">STICKY THREAD HEADER</div>
      <div class="spacer" id="spacer"></div>
    </div>
    <div class="composer">IN-FLOW COMPOSER (outside the scroll panel)</div>
  </div>
</div>
<script>
  // Minimal virtualized list: only rows intersecting the scrollport (+1 row of
  // buffer) exist in the DOM. Uses scrollTop and clientHeight, so a taller
  // viewport renders more rows, exactly like react-window/virtuoso.
  const COUNT = 120, ROW = 160, thread = document.getElementById('thread'), spacer = document.getElementById('spacer');
  spacer.style.height = (COUNT * ROW + 40) + 'px';
  function render() {
    const top = thread.scrollTop, h = thread.clientHeight;
    const first = Math.max(0, Math.floor(top / ROW) - 1), last = Math.min(COUNT - 1, Math.ceil((top + h) / ROW) + 1);
    spacer.replaceChildren();
    for (let i = first; i <= last; i++) {
      const r = document.createElement('div'); r.className = 'row'; r.style.top = (i * ROW) + 'px';
      r.textContent = i === COUNT - 1 ? `VIRTUAL FINAL MESSAGE ${i + 1}` : `Virtual message ${i + 1}`;
      spacer.append(r);
    }
  }
  thread.addEventListener('scroll', render, { passive: true });
  new ResizeObserver(render).observe(thread);
  render();
</script>
</body>
</html>
