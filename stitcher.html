<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tallshot &#x2014; PNG assembly</title>
  <style>
    @font-face { font-family: "Outfit"; font-weight: 500; src: url("fonts/outfit-latin-500-normal.woff2") format("woff2"); }
    :root { --paper:#f2efe8; --card:#faf8f2; --ink:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a; }
    @media (prefers-color-scheme: dark) { :root { --paper:#131311; --card:#1c1b18; --ink:#f2efe8; --muted:#a39e8f; } }
    body { margin:0; padding:24px; background:var(--paper); color:var(--ink); font:500 14px/1.5 "Outfit", system-ui, sans-serif; }
    main { max-width:560px; margin:14vh auto; border:1.5px solid var(--ink); padding:22px; background:var(--card); box-shadow:4px 4px 0 var(--ink); }
    h1 { font-size:20px; margin:0 0 6px; letter-spacing:-.03em; } h1 em { font-style:normal; color:var(--accent); }
    p { color:var(--muted); } #status { color:var(--ink); }
    progress { width:100%; height:10px; accent-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Tall<em>shot</em> is assembling your capture</h1>
    <p id="status">Preparing local image assembly&#x2026;</p>
    <progress id="progress" max="100" value="0"></progress>
    <p>Captured tiles are stored temporarily in this browser profile and deleted after export.</p>
  </main>
  <script src="geometry.js"></script>
  <script src="protocol.js"></script>
  <script src="pdf.js"></script>
  <script src="redact.js"></script>
  <script src="stitcher.js"></script>
</body>
</html>
